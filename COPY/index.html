<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #2980b9, #8e44ad);
        }

        .box {
            width: 350px;
            padding: 40px;
            background: white;
            box-shadow: 0 15px 25px rgba(0,0,0,.4);
            border-radius: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        h2, h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            border: none;
            background: #2980b9;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #8e44ad;
        }

        /* Dashboard */

        #dashboard {
            display: none;
            padding: 20px;
            color: white;
        }

        .topbar {
            background: rgba(0,0,0,.4);
            padding: 15px;
            text-align: right;
        }

        .topbar span {
            float: left;
            font-size: 18px;
        }

        .container {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            color: black;
            padding: 20px;
            width: 220px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,.3);
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        @media(max-width: 600px){
            .box {
                width: 90%;
            }
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="box" id="loginPage">
    <h2>Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>

    <div id="error" class="error"></div>

    <p style="text-align:center;margin-top:15px;">
        <b>Test Login:</b><br>
        admin / 1234
    </p>
</div>

<!-- DASHBOARD PAGE -->
<div id="dashboard">

    <div class="topbar">
        <span>Welcome, <b id="userName"></b></span>
        <button style="width:120px" onclick="logout()">Logout</button>
    </div>

    <h2>Dashboard</h2>
    <h3 id="time"></h3>

    <div class="container">

        <div class="card">
            <h3>Server Status</h3>
            <p id="status">● Running</p>
        </div>

        <div class="card">
            <h3>Containers</h3>
            <p>3 Running</p>
        </div>

        <div class="card">
            <h3>CPU Usage</h3>
            <p id="cpu">45%</p>
        </div>

        <div class="card">
            <h3>Memory</h3>
            <p id="ram">60%</p>
        </div>

    </div>

</div>

<script>
    // LOGIN FUNCTION
    function login() {
        const username = document.getElementById("username").value
        const password = document.getElementById("password").value
        const error = document.getElementById("error")

        if(username === "" || password === "") {
            error.innerText = "Please fill all fields"
            return
        }

        if(username === "admin" && password === "1234") {
            document.getElementById("loginPage").style.display = "none"
            document.getElementById("dashboard").style.display = "block"
            document.getElementById("userName").innerText = username

            updateTime()
            setInterval(updateTime, 1000)
            setInterval(updateData, 3000)
        } else {
            error.innerText = "Invalid username or password"
        }
    }

    // LOGOUT FUNCTION
    function logout() {
        location.reload()
    }

    // TIME FUNCTION
    function updateTime() {
        const now = new Date()
        document.getElementById("time").innerText =
            now.toDateString() + " | " + now.toLocaleTimeString()
    }

    // FAKE LIVE DATA CHANGE
    function updateData() {
        document.getElementById("cpu").innerText = Math.floor(Math.random()*50 + 40) + "%"
        document.getElementById("ram").innerText = Math.floor(Math.random()*40 + 50) + "%"
    }
</script>

</body>
</html>
